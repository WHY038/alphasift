name: Daily Stock Screening Report

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      strategy:
        description: '要执行的选股策略'
        required: true
        default: 'balanced_alpha'
        type: choice
        options:
          - dual_low
          - volume_breakout
          - quality_value
          - capital_heat
          - oversold_reversal
          - balanced_alpha
          - shrink_pullback

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run_and_email:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 🔥 这一步我完全修好了 🔥
      - name: Generate HTML Report
        id: generate_report
        run: |
          cat <<'EOF' > generate_report.py
          # -*- coding: utf-8 -*-
          import os
          import sys
          import logging
          import time
          from datetime import datetime
          from functools import wraps

          def apply_network_patch():
              try:
                  import pandas as pd
                  import requests
                  import alphasift.snapshot
                  from alphasift.snapshot import _normalize

                  original_fetch = alphasift.snapshot._fetch_em_datacenter

                  @wraps(original_fetch)
                  def patched_fetch(*args, **kwargs):
                      url = "https://data.eastmoney.com/dataapi/xuangu/list"
                      all_items = []
                      page = 1
                      page_size = 500
                      retries = 3
                      timeout = 60

                      while True:
                          params = {
                              "st": "SECURITY_CODE", "sr": "1", "ps": str(page_size), "p": str(page),
                              "sty": "SECUCODE,SECURITY_CODE,SECURITY_NAME_ABBR,NEW_PRICE,CHANGE_RATE,VOLUME_RATIO,DEAL_AMOUNT,TURNOVERRATE,PE9,PBNEWMRQ,TOTAL_MARKET_CAP,CIRCULATION_MARKET_CAP",
                              "filter": '(MARKET+in+("上交所主板","深交所主板","深交所创业板","上交所科创板","北交所"))',
                              "source": "SELECT_SECURITIES", "client": "WEB",
                          }
                          headers = {
                              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                              "Referer": "https://data.eastmoney.com/xuangu/",
                          }

                          data = None
                          for attempt in range(retries):
                              try:
                                  resp = requests.get(url, params=params, headers=headers, timeout=timeout)
                                  resp.raise_for_status()
                                  data = resp.json()
                                  break
                              except Exception as e:
                                  logging.warning(f"[PATCH] 网络请求第 {attempt + 1}/{retries} 次尝试失败: {e}")
                                  if attempt + 1 == retries:
                                      raise
                                  time.sleep(3 * (attempt + 1))

                          if data is None:
                              break
                          items = data.get("result", {}).get("data", [])
                          if not items:
                              break
                          all_items.extend(items)
                          total_count = data.get("result", {}).get("count", 0)
                          if not total_count or page * page_size >= total_count:
                              break
                          page += 1

                      if not all_items:
                          raise RuntimeError("[PATCH] 获取数据失败，所有数据源均无返回。")

                      df = pd.DataFrame(all_items)
                      return _normalize(df, source="em_datacenter")

                  alphasift.snapshot._fetch_em_datacenter = patched_fetch
                  print("网络请求补丁已成功应用！")

              except Exception as e:
                  print(f"应用补丁失败: {e}", file=sys.stderr)
                  sys.exit(1)

          apply_network_patch()

          from alphasift.pipeline import screen

          strategy = os.getenv("STRATEGY_INPUT", "balanced_alpha")
          print(f"Running strategy: {strategy}")

          try:
              result = screen(strategy, use_llm=True)
          except Exception as e:
              print(f"An error occurred during screening: {e}")
              with open("report.html", "w", encoding="utf-8") as f:
                  f.write(f"<h1>选股时发生错误</h1><p>策略: {strategy}</p><p>错误信息: {e}</p>")
              sys.exit(0)

          if not result or not result.picks:
              print("No stocks were picked. Exiting.")
              with open("report.html", "w", encoding="utf-8") as f:
                  f.write(f"<h1>选股结果</h1><p>策略: {strategy}</p><p>本次运行没有选出任何股票。</p>")
              sys.exit(0)

          html = f"""
          <!DOCTYPE html>
          <html>
          <head>
          <title>Alphasift 每日选股报告 ({strategy})</title>
          <style>
          body {{ font-family: sans-serif; }}
          table {{ border-collapse: collapse; width: 100%; }}
          th, td {{ border: 1px solid #ddd; padding: 8px; }}
          th {{ background: #f2f2f2; }}
          </style>
          </head>
          <body>
          <h1>Alphasift 每日选股报告</h1>
          <p>策略: {strategy}</p>
          <p>生成时间: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}</p>
          <table>
            <tr>
              <th>排名</th>
              <th>代码</th>
              <th>名称</th>
              <th>分数</th>
            </tr>
          """

          for pick in result.picks:
              html += f"<tr><td>{pick.rank}</td><td>{pick.code}</td><td>{pick.name}</td><td>{pick.final_score:.2f}</td></tr>"

          html += """
          </table>
          </body>
          </html>
          """

          with open("report.html", "w", encoding="utf-8") as f:
              f.write(html)

          print("Report generated successfully.")
          EOF

          python generate_report.py
        env:
          STRATEGY_INPUT: ${{ inputs.strategy }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          LLM_TEMPERATURE: 0.2
          LLM_MAX_RETRIES: 1

      - name: Send email report
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Alphasift 每日选股报告 (${{ inputs.strategy || 'balanced_alpha' }})"
          html_body: file://report.html
          to: ${{ secrets.MAIL_TO }}
          from: Alphasift Reporter <${{ secrets.MAIL_USERNAME }}>

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "【失败】Alphasift 选股报告"
          body: "工作流运行失败，请检查日志"
          to: ${{ secrets.MAIL_TO }}
          from: Alphasift Reporter <${{ secrets.MAIL_USERNAME }}>
