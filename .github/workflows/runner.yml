# 工作流的名称
name: Daily Stock Screening Report

on:
  # 1. 定时触发：每天北京时间 16:30 自动运行
  schedule:
    - cron: '30 8 * * 1-5' # UTC 时间 8:30 对应北京时间 16:30 (周一至周五)

  # 2. 手动触发：方便你随时运行
  workflow_dispatch:
    inputs:
      strategy:
        description: '要执行的选股策略'
        required: true
        default: 'balanced_alpha'
        type: choice
        options:
          - dual_low
          - volume_breakout
          - quality_value
          - capital_heat
          - oversold_reversal
          - balanced_alpha
          - shrink_pullback

jobs:
  run_and_email:
    runs-on: ubuntu-latest
    steps:
      # 步骤 1：检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤 2：设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 步骤 3：安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 步骤 4：运行 Python 脚本生成 HTML 报告
      - name: Generate HTML Report
        id: generate_report
        run: |
          # 创建一个 Python 脚本来调用 alphasift 并格式化输出
          cat <<'EOF' > generate_report.py
          import os
          import sys
          from datetime import datetime
          from alphasift.pipeline import screen

          # 从环境变量获取策略，手动触发时使用 inputs，定时触发时使用默认值
          strategy = os.getenv("STRATEGY_INPUT", "balanced_alpha")
          print(f"Running strategy: {strategy}")

          try:
              # 调用核心选股函数
              result = screen(strategy, use_llm=True)
          except Exception as e:
              print(f"An error occurred during screening: {e}")
              sys.exit(1)

          if not result or not result.picks:
              print("No stocks were picked. Exiting.")
              # 创建一个空的 report.html 以免后续步骤失败
              with open("report.html", "w", encoding="utf-8") as f:
                  f.write("<h1>选股结果</h1><p>本次运行没有选出任何股票。</p>")
              sys.exit(0)

          # --- 开始构建 HTML ---
          html = f"""
          <html>
          <head>
              <style>
                  body {{ font-family: sans-serif; }}
                  table {{ border-collapse: collapse; width: 100%; }}
                  th, td {{ border: 1px solid #dddddd; text-align: left; padding: 8px; }}
                  th {{ background-color: #f2f2f2; }}
                  .thesis {{ max-width: 400px; }}
              </style>
          </head>
          <body>
              <h2>Alphasift 选股报告 - {strategy}</h2>
              <p>生成时间: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}</p>
              <table>
                  <thead>
                      <tr>
                          <th>排名</th>
                          <th>代码</th>
                          <th>名称</th>
                          <th>分数</th>
                          <th>LLM 投资逻辑 (Thesis)</th>
                      </tr>
                  </thead>
                  <tbody>
          """

          for pick in result.picks:
              html += f"""
                      <tr>
                          <td>{pick.rank}</td>
                          <td>{pick.code}</td>
                          <td>{pick.name}</td>
                          <td>{pick.final_score:.2f}</td>
                          <td class="thesis">{pick.thesis or 'N/A'}</td>
                      </tr>
              """

          html += """
                  </tbody>
              </table>
          </body>
          </html>
          """

          # 将 HTML 写入文件
          with open("report.html", "w", encoding="utf-8") as f:
              f.write(html)

          print("HTML report generated successfully.")
          EOF

          # 执行刚刚创建的 Python 脚本
          python generate_report.py
        env:
          # 将手动触发的策略名传给 Python 脚本
          STRATEGY_INPUT: ${{ inputs.strategy }}
          # 核心环境变量
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          LLM_TEMPERATURE: 0.2
          LLM_MAX_RETRIES: 1

      # 步骤 5：发送邮件
      - name: Send email report
        uses: dawidd6/action-send-mail@v3
        with:
          # 邮件服务器配置，从 Secrets 读取
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          # 邮件主题
          subject: "Alphasift 每日选股报告 (${{ inputs.strategy || 'balanced_alpha' }})"
          # 邮件内容，直接读取 HTML 文件
          html_body: file://report.html
          # 收件人
          to: ${{ secrets.MAIL_TO }}
          # 发件人
          from: Alphasift Reporter <${{ secrets.MAIL_USERNAME }}>
