{
  "name": "Python CI",
  "on": {
    "workflow_dispatch": null,
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {
      "branches": [
        "main"
      ]
    }
  },
  "jobs": {
    "setup": {
      "runs-on": "ubuntu-latest",
      "outputs": {
        "python-versions": "${{ steps.get-versions.outputs.versions }}"
      },
      "steps": [
        {
          "name": "Checkout code",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Get compatible Python versions",
          "id": "get-versions",
          "run": "pip install tomli packaging\nVERSIONS=$(python .github/scripts/get_python_versions.py)\necho \"versions=$VERSIONS\" >> $GITHUB_OUTPUT\n"
        }
      ]
    },
    "build": {
      "needs": "setup",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "python-version": "${{ fromJson(needs.setup.outputs.python-versions) }}"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Set up Python ${{ matrix.python-version }}",
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "${{ matrix.python-version }}"
          }
        },
        {
          "name": "Install dependencies",
          "run": "python -m pip install --upgrade pip\npip install -e .[test]\n"
        },
        {
          "name": "Run tests",
          "env": {
            "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
            "DEEPSEEK_API_KEY": "${{ secrets.DEEPSEEK_API_KEY }}",
            "OPENAI_API_KEY": "${{ secrets.OPENAI_API_KEY }}",
            "LLM_TEMPERATURE": 0.2,
            "LLM_MAX_RETRIES": 1
          },
          "run": "pytest\n"
        }
      ]
    }
  }
}
