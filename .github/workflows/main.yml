+        run: |
+          pip install tomli packaging
+          VERSIONS=$(python -c '
+import tomli, json
+from packaging.specifiers import SpecifierSet
+
+# GitHub Actions 支持的、我们关心的 Python 版本列表
+AVAILABLE_PYTHONS = ["3.10", "3.11", "3.12"]
+with open("pyproject.toml", "rb") as f:
+  pyproject = tomli.load(f)
+specifier = SpecifierSet(pyproject["project"]["requires-python"])
+matching_versions = [v for v in AVAILABLE_PYTHONS if specifier.contains(v)]
+print(json.dumps(matching_versions))
+          ')
+          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
+
+  # 第二个任务：构建和测试
   build:
